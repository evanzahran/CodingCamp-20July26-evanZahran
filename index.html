<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Expense &amp; Budget Visualization</title>
    <link rel="stylesheet" href="css/style.css" />
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <div id="error-banner" role="alert" hidden>
      <span id="error-banner-message"></span>
      <button type="button" aria-label="Dismiss error">&#x00D7;</button>
    </div>

    <main>
      <header>
        <p id="balance-display" aria-live="polite">$0.00</p>
      </header>

      <section aria-labelledby="form-heading">
        <h2 id="form-heading">Add Transaction</h2>
        <form id="transaction-form" novalidate>
          <div class="field-group">
            <label for="input-name">Item Name</label>
            <input
              id="input-name"
              type="text"
              maxlength="100"
              autocomplete="off"
            />
            <span class="field-error" id="error-name" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="input-amount">Amount</label>
            <input
              id="input-amount"
              type="number"
              step="0.01"
              min="0.01"
              max="999999999.99"
            />
            <span class="field-error" id="error-amount" aria-live="polite"></span>
          </div>

          <div class="field-group">
            <label for="input-category">Category</label>
            <select id="input-category">
              <option value="">-- Select a category --</option>
              <option value="Food">Food</option>
              <option value="Transport">Transport</option>
              <option value="Fun">Fun</option>
            </select>
            <span class="field-error" id="error-category" aria-live="polite"></span>
          </div>

          <button id="btn-add" type="submit">Add Transaction</button>
        </form>
      </section>

      <section aria-labelledby="list-heading">
        <h2 id="list-heading">Transactions</h2>
        <ul id="transaction-list" aria-label="Transaction list"></ul>
      </section>

      <section aria-labelledby="chart-heading">
        <h2 id="chart-heading">Spending by Category</h2>
        <canvas id="chart-canvas"></canvas>
        <div id="chart-fallback" aria-live="polite" hidden></div>
      </section>
    </main>
  </body>
</html>
